name: SmartUI Edge 139 Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smartui-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Edge 139
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -L -o /tmp/edge.deb 'https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_139.0.3405.86-1_amd64.deb'
          sudo apt-get install -y --allow-downgrades /tmp/edge.deb
          rm /tmp/edge.deb
          sudo apt-get clean
          microsoft-edge-stable --version

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run SmartUI Capture
        env:
          PROJECT_TOKEN: "1868537#01KHK54YDYTYHKBCJ3KDK4SVVY#api_test_kane_2"
        run: npx smartui capture urls.json --config smartui-web.json
