name: SmartUI Edge 139 Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smartui-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run SmartUI Capture
        env:
          PROJECT_TOKEN: "1868537#01KHK54YDYTYHKBCJ3KDK4SVVY#api_test_kane_2"
        run: npx smartui capture urls.json --config smartui-web.json
